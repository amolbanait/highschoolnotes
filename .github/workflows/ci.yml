name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hsn
          POSTGRES_PASSWORD: hsn
          POSTGRES_DB: hsn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HSN_DATABASE_URL: postgresql+psycopg://hsn:hsn@localhost:5432/hsn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest
