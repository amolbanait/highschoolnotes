name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hsn
          POSTGRES_PASSWORD: hsn
          POSTGRES_DB: hsn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hsn"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      HSN_DATABASE_URL: postgresql+psycopg://hsn:hsn@localhost:5432/hsn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head && alembic check
      - run: pytest
      - name: Web app schema files are up to date
        run: python -m app.export_schemas ../frontend/lib/schema && git diff --exit-code ../frontend/lib/schema

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated types match the schema files
        run: npm run gen:types && git diff --exit-code lib/schema
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
